name: Machine Learning Workflow CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow dagshub scikit-learn pandas numpy matplotlib seaborn

    - name: Run MLflow Project Re-training
      env:
        MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        DAGSHUB_CLIENT_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        export MLFLOW_TRACKING_URI=$(cat MLProject/DagsHub.txt)
        mlflow run MLProject/ --entry-point main --env-manager local

    # TRIK UTAMA ADVANCE: Unduh model ke lokal menggunakan Python API yang aman
    - name: Download Model Artifact Locally
      env:
        MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        DAGSHUB_CLIENT_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        python -c "
        import mlflow
        with open('MLProject/DagsHub.txt', 'r') as f:
            mlflow.set_tracking_uri(f.read().strip())
        with open('run_id.txt', 'r') as f:
            run_id = f.read().strip()
        print(f'Mendownload model secara aman untuk Run ID: {run_id}')
        mlflow.artifacts.download_artifacts(run_id=run_id, artifact_path='predictive_maintenance_model', dst_path='.')
        print('Model berhasil diamankan di folder lokal!')
        "

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Kriteria 3 Advance: Bangun Docker Image menggunakan fungsi mlflow build-docker dari path lokal
    - name: Build and Push Docker Image
      run: |
        echo "Mengemas Docker Image menggunakan model lokal..."
        mlflow models build-docker -m "./predictive_maintenance_model" -n "${{ secrets.DOCKERHUB_USERNAME }}/predictive-maintenance-model:latest" --enable-mlserver
        docker push "${{ secrets.DOCKERHUB_USERNAME }}/predictive-maintenance-model:latest"