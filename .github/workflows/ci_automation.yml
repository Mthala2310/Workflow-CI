name: Machine Learning Workflow CI

# Trigger: Berjalan setiap kali ada push ke branch main atau dijalankan manual
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
    # 1. Ambil kode dari repositori
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Setup Python environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # 3. Install MLflow dan dependencies pendukung
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow dagshub scikit-learn pandas numpy matplotlib seaborn

    # 4. Jalankan Re-training Model menggunakan MLflow Project (Syarat Basic)
    - name: Run MLflow Project Re-training
      run: |
        mlflow run MLProject/ --entry-point main

    # 5. Login ke Docker Hub secara aman menggunakan GitHub Secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 6. Build & Push Docker Image menggunakan perintah mlflow build-docker (Syarat Advance)
    - name: Build and Push Docker Image
      run: |
        # Menggunakan perintah mlflow models build-docker untuk membungkus environment model
        mlflow models build-docker -m "runs:/latest/model" -n "${{ secrets.DOCKERHUB_USERNAME }}/predictive-maintenance-model:latest" --enable-mlserver
        
        # Push image yang berhasil dibuat ke Docker Hub Cloud
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/predictive-maintenance-model:latest