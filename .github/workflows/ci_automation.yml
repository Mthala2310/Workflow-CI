name: Machine Learning Workflow CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow dagshub scikit-learn pandas numpy matplotlib seaborn

    # Perbaikan Utama: Eksport alamat URL DagsHub ke environment sistem sebelum mlflow run dimulai
    - name: Run MLflow Project Re-training
      env:
        MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      run: |
        export MLFLOW_TRACKING_URI=$(cat MLProject/DagsHub.txt)
        mlflow run MLProject/ --entry-point main --env-manager local

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Perbaikan Kedua: Membaca RUN_ID spesifik yang dihasilkan dari file teks, bukan menebak kata "latest"
    - name: Build and Push Docker Image
      run: |
        RUN_ID=$(cat run_id.txt)
        echo "Mengemas model dari Run ID: $RUN_ID"
        mlflow models build-docker -m "runs:/$RUN_ID/predictive_maintenance_model" -n "${{ secrets.DOCKERHUB_USERNAME }}/predictive-maintenance-model:latest" --enable-mlserver
        docker push "${{ secrets.DOCKERHUB_USERNAME }}/predictive-maintenance-model:latest"